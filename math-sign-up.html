	<body class="subject-signup-page">
		<header>
			<div class="topnav">
				<div class="brand-wrap"><div class="brand"><img src="unnamed.png" alt="Brand logo" /></div><div class="brand-name">Path to Parallel</div></div>
				<nav class="nav-links" aria-label="Main navigation">

					  <div class="nav-item dropdown"><a href="get-involved.html">Get Involved</a><div class="dropdown-menu"><a href="get-involved.html">Sign up</a><a href="become.html">Become a Tutor</a><a href="contact.html">Contact</a></div></div>
					<a class="donate-btn" href="donate.html">Donate</a>
				</nav>
			</div>
		</header>
		<main>
			<section class="subject-signup-content">
				<h1>Math and Science</h1>
				<form class="subject-signup-form" action="https://formsubmit.co/ajax/lrlechpammer@gmail.com" method="POST">
					<input type="hidden" name="_subject" value="Math and science lesson sign-up request" />
					<input type="hidden" name="_captcha" value="false" />
					<label for="math-name">Student name</label>
					<input id="math-name" name="student_name" type="text" autocomplete="name" required />
					<label for="math-email">Email address (Parent Email)</label>
					<input id="math-email" name="email" type="email" autocomplete="email" required />
					<label for="math-age">Grade or age group</label>
					<input id="math-age" name="grade_or_age_group" type="text" placeholder="For example: Grade 8 or ages 13–15" required />
					<label for="math-experience">Last related math/science class taken</label>
					<textarea id="math-experience" name="experience_level" rows="3" placeholder="Tell us about the most recent related class you took" required></textarea>
					<label for="math-goals">Which topics would you like to explore?</label>
					<textarea id="math-goals" name="learning_goals" rows="4" required></textarea>
					<label for="math-availability">When are you generally available?</label>
					<input id="math-availability" name="availability" type="text" placeholder="Days and times that usually work" required />
					<button class="subject-signup-submit" type="submit">Send Sign-Up Request</button>
					<p class="subject-signup-status" role="status" aria-live="polite"></p>
				</form>
			</section>
		</main>

			<div class="newsletter-container"><h2>Join Our Newsletter</h2><p>Get the latest updates, articles, and insights delivered straight to your inbox.</p><form action="https://script.google.com/macros/s/AKfycbz8ZcInkp3gB8xMnevlLBhfnCM-vd4y0J7yPwML309eWQY3AYZbpsxMnb8vaDcVF9l11Q/exec" method="POST" class="newsletter-form"><input type="hidden" name="_subject" value="New Newsletter Subscriber!" /><input type="hidden" name="_template" value="table" /><input type="email" name="email" placeholder="Enter your email address" required /><button type="submit">Subscribe</button></form><p class="newsletter-status" role="status" aria-live="polite"></p></div>
